[workspace]
members = [
  "et-core",
  "et-encoding",
  "et-dsl",
  "et-sys",
  "et-python",
  "benches",
]
resolver = "3"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.package]
version = "0.7.3"
license = "MIT OR Apache-2.0"
edition = "2024"
readme = "README.md"
repository = "https://github.com/aetherus-wg/eldritch-trace"

[workspace.dependencies]
et-encoding = { path = "et-encoding", version = "^0.7.3" }
et-core = { path = "et-core", version = "^0.7.3" }
et-dsl = { path = "et-dsl", version = "^0.7.3" }

events-ledger = "^0.3.11"
ariadne = "0.6.0"
chumsky = "0.12.0"
itertools = "0.14.0"
log = "0.4.29"
env_logger = "0.11.10"
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
csv = "1.4.0"
markdown-ppp = "2.9.2"
regex = "1.12.3"
hdf5-metno = "0.14.1"
serde = { version = "1.0.229", features = ["derive"] }
array-bytes = { version = "9.3.0", features = ["serde"] }
rayon = "^1.12.0"
yaml_serde = "0.10.6"
